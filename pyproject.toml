[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyargus"
version = "0.1.0"
description = "An open-source lidar production suite: strip QA, alignment, and what follows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
pyargus = "pyargus.cli:main"

[project.optional-dependencies]
# Reading LAS/LAZ. Not required for the math core or for SBET work,
# which is why it is here rather than in dependencies: pyargus.formats.las
# raises with an instruction if it is missing, and nothing else imports it.
lidar = ["laspy[lazrs]>=2.5"]

# Trajectory-to-map-frame plumbing (Phase 4.5): transforming SBET
# geographic coordinates into the delivery CRS. Same lazy pattern.
crs = ["pyproj>=3.6"]

# Above-ground classification (Phase 5): the random forest. Same lazy
# pattern; the math core never imports it.
ml = ["scikit-learn>=1.3"]

# Colorization: reading the aerial JPEGs. Same lazy pattern --
# pyargus.imagery.colorize raises with an instruction if it is missing.
imagery = ["pillow>=10"]

dev = ["pytest>=7", "laspy[lazrs]>=2.5", "pyproj>=3.6",
       "scikit-learn>=1.3", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["pyargus*"]

# An editable install reads assets from the source tree and hides
# their absence; a wheel install would lose the window icon without
# this (the pyLynceus lesson, kept).
[tool.setuptools.package-data]
pyargus = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
